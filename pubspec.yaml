publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: 2.5.1
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  lucide_icons_flutter: ^3.1.19
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
